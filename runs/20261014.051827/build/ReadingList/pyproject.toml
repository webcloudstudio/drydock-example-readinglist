[project]
name = "readinglist"
version = "0.1.0"
description = "A small web application that keeps a reader's list of books to read."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
