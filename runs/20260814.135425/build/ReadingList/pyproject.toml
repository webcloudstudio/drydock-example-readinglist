[project]
name = "readinglist"
version = "0.1.0"
description = "A web application for maintaining an ordered reading list of books and tracking which books have been read."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
